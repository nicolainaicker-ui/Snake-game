<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>Snake</h1>

      <div class="hud">
        <span>Score: <strong id="score">0</strong></span>
        <button id="restartBtn" type="button">Restart</button>
      </div>

      <div id="board" class="board" aria-label="Snake game board"></div>
      <div class="touch-controls" role="group" aria-label="Directional controls">
        <button class="direction-button direction-up" type="button" data-direction="up" aria-label="Move up">↑</button>
        <button class="direction-button direction-left" type="button" data-direction="left" aria-label="Move left">←</button>
        <button class="direction-button direction-down" type="button" data-direction="down" aria-label="Move down">↓</button>
        <button class="direction-button direction-right" type="button" data-direction="right" aria-label="Move right">→</button>
      </div>
      <p id="message">Use arrow keys, WASD, swipe, or the directional buttons to move.</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
